[project]
name = "opf-sirl"
version = "0.1.0"
description = "Solver-informed RL (SIRL) for MATPOWER optimal power flow modelling on ProOPF"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["opf_sirl*", "trainers*"]

[tool.setuptools.package-data]
"opf_sirl.verifier" = ["matlab/*.m"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["matlab: needs a running MATLAB (and the campus license / VPN)"]
